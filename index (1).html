/* =========================

========================= */

function showPage(pageName){

var pages=document.querySelectorAll(".page");

for(var i=0;i<pages.length;i++){
pages[i].classList.remove("active");
}

document.getElementById(pageName).classList.add("active");

window.scrollTo(0,0);
}


/* =========================
   مشاركة الموقع
========================= */

document.getElementById("shareButton").onclick = async function(){

var shareData = {
title:"🕌 المسابقة الدينية",
text:"شارك في المسابقة الدينية واختبر معلوماتك!",
url:window.location.href
};

try{

if(navigator.share){

await navigator.share(shareData);

}else{

await navigator.clipboard.writeText(window.location.href);

alert("✅ تم نسخ رابط المسابقة.\nيمكنك الآن إرساله لأي شخص.");

}

}catch(error){

if(error.name !== "AbortError"){

try{

await navigator.clipboard.writeText(window.location.href);

alert("✅ تم نسخ رابط المسابقة.");

}catch(e){

prompt("انسخ رابط المسابقة:",window.location.href);

}

}

}

};

var lastScore = 0;

function showCertificate(){

var name = localStorage.getItem("studentName") || "الطالب";

var total = questions.length;

var certificateBox = document.getElementById("certificateBox");

certificateBox.innerHTML =

"<div class='cert-title'>تشهد المسابقة الدينية</div>"+
"<p>بأن الطالب / الطالبة</p>"+
"<div class='student-name'>"+escapeHtml(name)+"</div>"+
"<p class='score-text'>"+
"قد أتم المسابقة الدينية بنجاح<br>"+
"وحصل على درجة<br>"+
"<strong>"+lastScore+" / "+total+"</strong>"+

"</p>"+
"<div class='cert-footer'>"+
"شهادة تقدير إلكترونية<br>"+
"🕌 المسابقة الدينية"+
"</div>"+
"</div>";

document.getElementById("saveCertificateButton").style.display="inline-block";

certificateBox.scrollIntoView({behavior:"smooth",block:"center"});

}

function escapeHtml(text){

var div=document.createElement("div");
div.textContent=text;
return div.innerHTML;

}


/* =========================
   حفظ الشهادة كصورة
========================= */

document.getElementById("saveCertificateButton").onclick=function(){

var certificate=document.getElementById("certificate");

if(!certificate){
alert("اضغط أولاً على «عرض شهادة التقدير»");
return;
}

var canvas=document.createElement("canvas");

var scale=2;

var width=900;
var height=650;

canvas.width=width*scale;
canvas.height=height*scale;

var ctx=canvas.getContext("2d");

ctx.scale(scale,scale);

ctx.fillStyle="#fffdf2";

ctx.strokeStyle="#c9a227";
ctx.lineWidth=12;
ctx.strokeRect(12,12,width-24,height-24);

ctx.strokeStyle="#8b6914";
ctx.lineWidth=3;
ctx.strokeRect(28,28,width-56,height-56);

ctx.textAlign="center";
ctx.fillStyle="#17452d";

ctx.font="bold 44px Tahoma";
ctx.fillText("🕌  🏆  🕌",width/2,105);

ctx.fillStyle="#8b6914";

ctx.fillStyle="#333";
ctx.font="26px Tahoma";

ctx.fillStyle="#8b6914";
ctx.font="bold 42px Tahoma";
ctx.fillText(localStorage.getItem("studentName") || "الطالب",width/2,310);

ctx.fillStyle="#333";
ctx.font="26px Tahoma";
ctx.fillText("قد أتم المسابقة الدينية بنجاح",width/2,365);

ctx.fillStyle="#17452d";
ctx.font="bold 38px Tahoma";
ctx.fillText("النتيجة: "+lastScore+" / "+questions.length,width/2,430);

ctx.fillStyle="#555";
ctx.font="22px Tahoma";
ctx.fillText("🎉 مع خالص التهاني والتقدير 🎉",width/2,490);

ctx.font="18px Tahoma";
ctx.fillText("شهادة تقدير إلكترونية - المسابقة الدينية",width/2,550);

var link=document.createElement("a");

link.download="شهادة_تقدير.png";
link.href=canvas.toDataURL("image/png");

link.click();

alert("✅ تم تجهيز شهادة التقدير وحفظها كصورة.");

};

/* =========================

========================= */

document.getElementById("studentStart").onclick=function(){

var name=document.getElementById("studentName").value.trim();

var password=document.getElementById("studentPassword").value.trim();

if(name===""){
alert("اكتب اسم الطالب");
return;
}

if(password===""){
alert("اكتب كلمة المرور");
return;
}

localStorage.setItem("studentName",name);

showQuiz();

showPage("quizPage");

};


/* =========================
   عرض الأسئلة
========================= */

function showQuiz(){

var box=document.getElementById("quizBox");

box.innerHTML="";

for(var i=0;i<questions.length;i++){

var q=questions[i];

var html="";

html+="<div class='question'>";

html+="<h3>";
html+=(i+1)+") "+q.q;
html+="</h3>";

for(var j=0;j<q.a.length;j++){

html+="<label class='answer'>";

html+="<input type='radio' ";

html+="name='question"+i+"' ";

html+="value='"+j+"'> ";

html+=q.a[j];

html+="</label>";

}

html+="</div>";

box.innerHTML+=html;

}

}


/* =========================
   إنهاء المسابقة
========================= */

document.getElementById("finishButton").onclick=function(){

var score=0;

for(var i=0;i<questions.length;i++){

var answer=document.querySelector(
"input[name='question"+i+"']:checked"
);

if(!answer){

alert("من فضلك أجب عن جميع الأسئلة");

return;

}

if(parseInt(answer.value)===questions[i].correct){

score++;

}

}

lastScore = score;

var name=localStorage.getItem("studentName") || "الطالب";

var result=document.getElementById("resultBox");

if(score>=16){

result.innerHTML=
"<p class='score'>"+
score+" / "+questions.length+
"</p>"+
"<div class='success'>"+
"🎉 مبروك يا "+name+
"<br><br>"+
"🏆 تستحق شهادة تقدير"+
"</div>";

}else{

result.innerHTML=
"<p class='score'>"+
score+" / "+questions.length+
"</p>"+
"<p class='center'>"+
"حاول مرة أخرى 💪"+
"</p>";

}

showPage("resultPage");

};


/* =========================
   دخول المسؤول

var username=document.getElementById("adminUsername").value.trim();

var password=document.getElementById("adminPassword").value.trim();

if(username==="admin" && password==="123456"){

renderAdmin();

showPage("adminPage");

}else{

alert("اسم المستخدم أو كلمة المرور غير صحيحة");

html+="<p>1️⃣ "+q.a[0]+"</p>";
html+="<p>2️⃣ "+q.a[1]+"</p>";
html+="<p>3️⃣ "+q.a[2]+"</p>";
html+="<p>4️⃣ "+q.a[3]+"</p>";

html+="<p class='correct'>";
html+="✅ الإجابة الصحيحة: ";
html+=q.a[q.correct];
html+="</p>";

html+="<button onclick='editQuestion("+i+")'>";
html+="✏️ تعديل";
html+="</button>";

html+="<button class='danger' onclick='deleteQuestion("+i+")'>";
html+="🗑️ حذف";
html+="</button>";

html+="</div>";

box.innerHTML+=html;

}

}

/* =========================
   حفظ سؤال جديد
========================= */

function addQuestion(){

var q=document.getElementById("newQ").value.trim();

var answers=[

document.getElementById("newA1").value.trim(),
document.getElementById("newA2").value.trim(),
document.getElementById("newA3").value.trim(),
document.getElementById("newA4").value.trim()

];

var correct=parseInt(
document.getElementById("newCorrect").value
);

if(
q==="" ||
answers[0]==="" ||
answers[1]==="" ||
answers[2]==="" ||
answers[3]===""
){

alert("من فضلك املأ جميع البيانات");

return;

}

questions.push({
q:q,
a:answers,
correct:correct
});

saveQuestions();

document.getElementById("formBox").innerHTML="";

renderAdmin();

alert("تم إضافة السؤال بنجاح");

}


/* =========================
   تعديل سؤال
========================= */

function editQuestion(index){

var q=questions[index];

document.getElementById("formBox").innerHTML=

"<div class='admin-question'>"+

"<h3>✏️ تعديل السؤال</h3>"+

"<input id='editQ'>"+

"<input id='editA1'>"+

"<input id='editA2'>"+

"<input id='editA3'>"+

"<input id='editA4'>"+

"<select id='editCorrect'>"+

"<option value='0'>الإجابة الأولى صحيحة</option>"+

"<option value='1'>الإجابة الثانية صحيحة</option>"+

"<option value='2'>الإجابة الثالثة صحيحة</option>"+

"<option value='3'>الإجابة الرابعة صحيحة</option>"+

"</select>"+

"<button onclick='saveEdit("+index+")'>"+
"💾 حفظ التعديل"+
"</button>"+

"</div>";

document.getElementById("editQ").value=q.q;
document.getElementById("editA1").value=q.a[0];
document.getElementById("editA2").value=q.a[1];
document.getElementById("editA3").value=q.a[2];
document.getElementById("editA4").value=q.a[3];
document.getElementById("editCorrect").value=q.correct;

}


/* =========================
   حفظ التعديل
========================= */

function saveEdit(index){

var q=document.getElementById("editQ").value.trim();

var answers=[

document.getElementById("editA1").value.trim(),
document.getElementById("editA2").value.trim(),
document.getElementById("editA3").value.trim(),
document.getElementById("editA4").value.trim()

];

var correct=parseInt(
document.getElementById("editCorrect").value
);

if(
q==="" ||
answers[0]==="" ||
answers[1]==="" ||
answers[2]==="" ||
answers[3]===""
){

alert("من فضلك املأ جميع البيانات");

return;

}

questions[index]={
q:q,
a:answers,
correct:correct
};

saveQuestions();

document.getElementById("formBox").innerHTML="";

renderAdmin();

alert("تم تعديل السؤال");

}


/* =========================
   حذف سؤال
========================= */

function deleteQuestion(index){

if(confirm("هل تريد حذف هذا السؤال؟")){

questions.splice(index,1);

saveQuestions();

renderAdmin();

}

}


/* =========================
   حفظ الأسئلة
========================= */

function saveQuestions(){

localStorage.setItem(
"religiousQuestions",
JSON.stringify(questions)
);

}


/* =========================
   إعادة الأسئلة
========================= */

document.getElementById("resetButton").onclick=function(){

if(confirm("هل تريد إعادة الأسئلة الأصلية؟")){

localStorage.removeItem("religiousQuestions");

location.reload();

}

};


/* =========================
   تسجيل الخروج
========================= */

document.getElementById("logoutButton").onclick=function(){

showPage("home");

};

</script>
